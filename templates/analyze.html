<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVision - Forensic Analysis</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- GSAP Animation Library -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="/static/css/analyze.css">
</head>
<body>

    <!-- 1. FLOATING BACKGROUND ELEMENTS -->
    <div id="floating-bg">
        <!-- JS will inject circles here -->
    </div>

    <!-- UI ELEMENTS -->
    <div class="back-btn" onclick="window.location.href='/'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Exit</span>
    </div>

    <div class="upload-wrapper">
        <div class="upload-card" id="main-card">
            <div class="header-text">
                <h1>Forensic Upload</h1>
                <p>Secure verification environment</p>
            </div>

            <!-- COMPACT TABS -->
            <div class="tabs-container">
                <button class="tab-btn active" onclick="switchTab('image')">Image</button>
                <button class="tab-btn" onclick="switchTab('audio')">Audio</button>
            </div>

            <div class="upload-area-wrapper">
                
                <!-- IMAGE TAB -->
                <div id="image-tab" class="upload-content active">
                    <div class="drop-zone" id="image-drop-zone">
                        <div class="icon-large">
                            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </div>
                        <div class="upload-label">Drop Image</div>
                        <div class="upload-sublabel">JPG, PNG (Max 10MB)</div>
                        <input type="file" id="image-input" hidden accept="image/*">
                    </div>
                    <img id="image-preview" alt="Preview">
                </div>

                <!-- AUDIO TAB -->
                <div id="audio-tab" class="upload-content">
                    <div class="drop-zone" id="audio-drop-zone">
                        <div class="icon-large">
                            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="23"></line>
                                <line x1="8" y1="23" x2="16" y2="23"></line>
                            </svg>
                        </div>
                        <div class="upload-label">Drop Audio</div>
                        <div class="upload-sublabel">MP3, WAV, AAC</div>
                        <input type="file" id="audio-input" hidden accept="audio/*">
                    </div>
                    <div class="audio-waveform" id="audio-visual">
                        <div class="bar" style="animation-delay: 0s"></div>
                        <div class="bar" style="animation-delay: 0.1s"></div>
                        <div class="bar" style="animation-delay: 0.2s"></div>
                        <div class="bar" style="animation-delay: 0.3s"></div>
                        <div class="bar" style="animation-delay: 0.2s"></div>
                        <div class="bar" style="animation-delay: 0.1s"></div>
                    </div>
                </div>

            </div>

            <div class="analyze-btn-container">
                <button class="analyze-btn" id="analyze-btn" onclick="startAnalysis()">
                    <span id="btn-text">Analyze</span>
                    <div class="spinner" id="btn-spinner"></div>
                    <svg id="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- DETAILED RESULT MODAL -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-card">
            <!-- Dynamic Icon -->
            <div class="modal-icon" id="m-icon">
                <svg id="icon-check" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <svg id="icon-alert" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            
            <div class="modal-title" id="m-title">Analysis Complete</div>
            
            <div class="score-container">
                <span>Confidence Score</span>
                <span id="m-score">98%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="m-progress" class="progress-bar-fill"></div>
            </div>

            <p class="modal-desc" id="m-desc">Analysis description goes here...</p>

            <!-- Detailed Parameters List -->
            <div class="metrics-list" id="m-metrics">
                <!-- Javascript will inject metrics here -->
            </div>

            <button class="modal-btn" onclick="closeModal()">Close Report</button>
        </div>
    </div>

    <script src="/static/js/analyze.js"></script>
</body>
</html>
